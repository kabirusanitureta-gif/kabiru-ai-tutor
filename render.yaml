# Kabiru AI Tutor — Render Blueprint
databases:
  - name: kabiru-ai-tutor-db
    plan: free
    databaseName: kabiru_tutor
    user: kabiru_tutor

services:
  # ------------------------- Backend (FastAPI) -------------------------
  - type: web
    name: kabiru-ai-tutor-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd backend && python -m app.seed.run_seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kabiru-ai-tutor-db
          property: connectionString
      - key: OLLAMA_ENABLED
        value: "false"
      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: AI_API_MODEL
        value: "llama-3.3-70b-versatile"
      - key: FRONTEND_ORIGIN
        value: "https://kabiru-ai-tutor-frontend.onrender.com"
      - key: WEBAUTHN_RP_ID
        value: "kabiru-ai-tutor-frontend.onrender.com"
      - key: WEBAUTHN_ORIGIN
        value: "https://kabiru-ai-tutor-frontend.onrender.com"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
    healthCheckPath: /api/health

  # ------------------------- Frontend (React/Vite) -------------------------
  - type: web
    name: kabiru-ai-tutor-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: "https://kabiru-ai-tutor-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
