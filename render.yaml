# Kabiru AI Tutor — Render Blueprint
#
# This file lets Render configure the ENTIRE stack automatically — backend,
# frontend, and a persistent Postgres database — with zero manual dashboard
# field-filling. This eliminates the class of bugs caused by hand-typing
# Root Directory / Build Command / Start Command incorrectly.
#
# To use: go to https://dashboard.render.com/blueprints, click "New Blueprint
# Instance", and point it at this repository. Render reads this file and
# creates everything below automatically.
#
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: kabiru-ai-tutor-db
    plan: free
    databaseName: kabiru_tutor
    user: kabiru_tutor

services:
  # ------------------------- Backend (FastAPI) -------------------------
  - type: web
    name: kabiru-ai-tutor-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r ../requirements.txt"
    startCommand: "python -m app.seed.run_seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong random secret automatically
      - key: DATABASE_URL
        fromDatabase:
          name: kabiru-ai-tutor-db
          property: connectionString  # persistent Postgres — survives every redeploy
      - key: OLLAMA_ENABLED
        value: "false"                # no local Ollama on Render; rule-based tutor fallback is used
      - key: FRONTEND_ORIGIN
        value: "https://kabiru-ai-tutor-frontend.onrender.com"
    healthCheckPath: /api/health

  # ------------------------- Frontend (React/Vite) -------------------------
  - type: web
    name: kabiru-ai-tutor-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: "https://kabiru-ai-tutor-backend.onrender.com"
    routes:
      # Single-page app: any unmatched path serves index.html so React Router
      # handles client-side routing (fixes blank/404 pages on refresh).
      - type: rewrite
        source: /*
        destination: /index.html
