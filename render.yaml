databases:
  - name: kabiru-ai-tutor-db
    plan: free
    databaseName: kabiru_tutor
    user: kabiru_tutor

services:
  - type: web
    name: kabiru-ai-tutor-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && python -m app.seed.run_seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: ENV
        value: production

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: kabiru-ai-tutor-db
          property: connectionString

      - key: OLLAMA_ENABLED
        value: "false"

      - key: GEMINI_API_KEY
        sync: false

      - key: FRONTEND_ORIGIN
        value: https://kabiru-ai-tutor-frontend.onrender.com

    healthCheckPath: /api/health

  - type: static
    name: kabiru-ai-tutor-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: frontend/dist

    envVars:
      - key: VITE_API_URL
        value: https://kabiru-ai-tutor-backend.onrender.com

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
