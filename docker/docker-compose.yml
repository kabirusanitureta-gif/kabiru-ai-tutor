version: "3.9"

# Kabiru AI Tutor — Docker Compose
# Run from the project root with: docker compose -f docker/docker-compose.yml up --build

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: kabiru-tutor-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./kabiru_tutor.db
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_long_random_secret_key_before_production}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - backend_db:/app/backend
      - certificates_data:/app/certificates
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: kabiru-tutor-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_db:
  certificates_data:
